music_directory "~/Musicas/musics"
playlist_directory "~/Musicas/musics/playlists"
db_file "~/.mpd/mpd.db"
log_file "~/.mpd/mpd.log"
pid_file "~/.mpd/mpd.pid"
state_file "~/.mpd/mpdstate"


audio_output {
    type    "pulse"
    name    "pulseaudio"
}

audio_output {
    type        "fifo"
    name        "toggle_visualizer"
    path        "/tmp/mpd.fifo"
    format      "44100:16:2"
}


bind_to_address "127.0.0.1"
port "6601"


